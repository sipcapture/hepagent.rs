[package]
authors = ["Berkus Decker <berkus+cargo@metta.systems>","Alexandr Dubovikov <alexandr.dubovikov@gmail.com>",]
name = "hepagent"
publish = false
version = "0.1.0"

[dependencies]
anyhow = "1.0"
byteorder = "1.2.3"
chrono = "0.4.3"
docopt = "1.0.0"
fern = "0.5.5"
futures = "~0.1"
lazy-pool = "0.2.2"
log = "0.4.2"
luajit = "0.1.1"
num_cpus = "1.8.0"
objpool = "0.2.0"
packet = "0.1.2"
parsip = "0.1.0"
pool = "0.1.4"
serde = "1.0.66"
serde_derive = "1.0.66"
pnet_macros_support = "0.35.0"
pnet_macros = "0.35.0"

[dependencies.hep3]
path = "hep-rs"

[dependencies.pnet]
version = "0.35.0"
features = ["pcap"]

[features]
default = ["sip"]
sip = []
